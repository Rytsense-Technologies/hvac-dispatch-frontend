# The staff console and the API on ONE address, so the sign-in cookie is first-party and no cross-origin settings are needed.
# These files are served as they are (no build). /v1 (the API), /tech (the technician's phone page) and /healthz go to the api service.
# Put https in front of this in production: the session cookie is Secure outside development.
server {
    listen 5500;
    server_name _;
    # Look the API up again every few seconds (Docker's own DNS): a rebuilt API container gets a new address, and a fixed lookup at start-up would answer 502 until nginx restarted.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8010;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # The console runs its own scripts and talks to its own address; the Jobs map also loads Google Maps (script, tiles, fonts) when a map key is set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com; font-src https://fonts.gstatic.com; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com; worker-src blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # A customer who opens their private quote or invoice link in a browser gets the page (customer.html); the page itself then asks the API for the
    # data (it sends Accept: application/json, so it reaches the API below). The address stays /billing/quotes/<token>, which is why its files use
    # absolute paths.
    location ~ ^/billing/(quotes|invoices)/[^/]+$ {
        if ($http_accept ~* "text/html") { rewrite ^ /customer.html last; }
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The rest of /billing: the pay and answer buttons, the "thank you" pages, and the payment providers' webhooks (signed; the API checks every one).
    location /billing/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
    }

    location /tech {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The emailed one-time link (register an admin, add a technician, reset a password) opens this
    # address; the backend serves the ready-made "choose a password" page itself, not this frontend.
    location /set-password {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass $api_upstream/healthz;
    }

    # The test-call page loads the LiveKit client from a CDN and connects to the LiveKit server, so it needs a wider policy than the console.
    location = /call.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src 'self' ws: wss: http: https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The customer portal is its own small page and talks to the API directly; leave its policy to the page.
    location /portal/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    location = /nginx.conf { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
